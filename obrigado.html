<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro Enviado - CM Reguladora de Sinistros</title>
  <link rel="icon" type="image/jpeg" href="images/cm-logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .obrigado-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--cm-dark) 0%, var(--cm-dark-lighter) 100%);
      padding: 24px;
      text-align: center;
    }
    .obrigado-card {
      background: var(--cm-white);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      max-width: 480px;
      box-shadow: var(--shadow-xl);
    }
    .obrigado-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(40, 167, 69, 0.12);
      color: #28a745;
      font-size: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .obrigado-card h1 {
      font-family: var(--font-heading);
      font-size: 24px;
      color: var(--cm-dark);
      margin-bottom: 12px;
    }
    .obrigado-card p {
      color: var(--cm-gray-600);
      font-size: 15px;
      margin-bottom: 28px;
    }
  </style>
</head>

<body>
  <div class="obrigado-wrap">
    <div class="obrigado-card">
      <div class="obrigado-icon"><i class="fas fa-check"></i></div>
      <h1>Cadastro enviado com sucesso!</h1>
      <p>Recebemos seus dados e documentos. Nossa equipe vai analisar seu cadastro e entrará em contato em breve pelo telefone ou e-mail informado.</p>
      <a href="index.html" class="btn-primary"><i class="fas fa-home"></i> Voltar ao Início</a>
    </div>
  </div>
</body>

</html>
